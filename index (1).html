<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Snake Game Mobile</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        canvas {
            background-color: black;
            margin-top: 20px;
            border: 2px solid white;
        }
        .controls {
            margin-top: 20px;
        }
        .btn {
            background-color: #333;
            color: white;
            font-size: 20px;
            padding: 15px 25px;
            margin: 5px;
            border-radius: 10px;
            border: none;
        }
    </style>
</head>
<body>

    <h1>Snake Game 🐍</h1>
    <p>Use Arrow Keys or Buttons to Play</p>

    <canvas id="game" width="400" height="400"></canvas>

    <div class="controls">
        <button class="btn" onclick="changeDirection('UP')">↑</button><br>
        <button class="btn" onclick="changeDirection('LEFT')">←</button>
        <button class="btn" onclick="changeDirection('DOWN')">↓</button>
        <button class="btn" onclick="changeDirection('RIGHT')">→</button>
    </div>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        const box = 20;
        let snake = [{ x: 9 * box, y: 10 * box }];
        let direction = "RIGHT";

        let food = {
            x: Math.floor(Math.random() * 19 + 1) * box,
            y: Math.floor(Math.random() * 19 + 1) * box
        };

        let score = 0;

        // Keyboard controls
        document.addEventListener("keydown", function(event) {
            if (event.keyCode == 37 && direction != "RIGHT") direction = "LEFT";
            else if (event.keyCode == 38 && direction != "DOWN") direction = "UP";
            else if (event.keyCode == 39 && direction != "LEFT") direction = "RIGHT";
            else if (event.keyCode == 40 && direction != "UP") direction = "DOWN";
        });

        // Mobile buttons
        function changeDirection(newDir) {
            if(newDir == "LEFT" && direction != "RIGHT") direction = "LEFT";
            else if(newDir == "UP" && direction != "DOWN") direction = "UP";
            else if(newDir == "RIGHT" && direction != "LEFT") direction = "RIGHT";
            else if(newDir == "DOWN" && direction != "UP") direction = "DOWN";
        }

        function draw() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = (i == 0) ? "lime" : "green";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
            }

            ctx.fillStyle = "red";
            ctx.fillRect(food.x, food.y, box, box);

            let headX = snake[0].x;
            let headY = snake[0].y;

            if (direction == "LEFT") headX -= box;
            if (direction == "UP") headY -= box;
            if (direction == "RIGHT") headX += box;
            if (direction == "DOWN") headY += box;

            if (headX == food.x && headY == food.y) {
                score++;
                food = {
                    x: Math.floor(Math.random() * 19 + 1) * box,
                    y: Math.floor(Math.random() * 19 + 1) * box
                };
            } else {
                snake.pop();
            }

            let newHead = { x: headX, y: headY };

            if (
                headX < 0 || headY < 0 ||
                headX >= canvas.width || headY >= canvas.height ||
                collision(newHead, snake)
            ) {
                clearInterval(game);
                alert("Game Over! Score: " + score);
            }

            snake.unshift(newHead);

            ctx.fillStyle = "white";
            ctx.font = "20px Arial";
            ctx.fillText("Score: " + score, 10, 25);
        }

        function collision(head, array) {
            for (let i = 0; i < array.length; i++) {
                if (head.x == array[i].x && head.y == array[i].y) {
                    return true;
                }
            }
            return false;
        }

        let game = setInterval(draw, 150);
    </script>

</body>
</html>
